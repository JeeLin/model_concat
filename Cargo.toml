[package]
name = "model_concat"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8"}
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
toml = "0.8"
base64 = "0.22"
chrono = "0.4"
bytes = "1.5" 
uuid = { version = "1.7", features = ["v4"] }
symphonia = { version = "0.5", features = ["mp3", "wav", "aac", "isomp4", "ogg", "vorbis"] }
rubato = "0.16"
hound = "3.5"
lewton = "0.10"
minimp3 = "0.5"
parking_lot = "0.12"
rayon = "1.8"
num_cpus = "1.16"
linked-hash-map = "0.5"